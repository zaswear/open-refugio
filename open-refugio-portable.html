  function init() {
    try {

      if (saved && SUPPORTED.includes(saved)) {
        currentLang = saved;
      } else {
        const browserLang = (navigator.language || 'es').slice(0, 2).toLowerCase();
        if (SUPPORTED.includes(browserLang)) {
          currentLang = browserLang;
        }
      }
    } catch (e) {
      currentLang = 'es';
    }
    document.documentElement.lang = currentLang;
  }

  function t(key) {
    const dict = translations[currentLang] || translations.es;
    return dict[key] || translations.es[key] || key;
  }

  function setLanguage(lang) {
    if (!SUPPORTED.includes(lang)) return;
    currentLang = lang;
    try {
      localStorage.setItem(STORAGE_KEY, lang);
    } catch (e) {}
    document.documentElement.lang = lang;
    window.dispatchEvent(new CustomEvent('openrefugio:langchange', { detail: { lang } }));
  }

  function getLanguage() {
    return currentLang;
  }

  function getSupported() {
    return [...SUPPORTED];
  }

  init();

  return {
    t,
    setLanguage,
    getLanguage,
    getSupported,
    translations
  };

    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = { ...DEFAULT_PROFILE, ...parsed };
      }
    } catch (e) {
      console.warn('Could not read OpenRefugio profile, using defaults:', e);
      state = { ...DEFAULT_PROFILE };
    }

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      window.dispatchEvent(new CustomEvent('openrefugio:profilechange', { detail: state }));
    } catch (e) {
      console.error('Failed to persist OpenRefugio profile:', e);
    }
    return state;
  }

    const p = PRESETS[presetKey] || PRESETS.universal;

/**
 * OpenRefugio Tools: WebAudio Metronome, Burn Timers, Check-in Reminder, and Screen Flashlight.
 * Completely local, zero audio assets, works offline.
 */
window.OpenRefugioTools = (function() {
  let audio = null;
  let metronomo = null;
  let compresiones = 0;
  let cuentaQuemadura = null;
  let restanQuemadura = 0;
  let wakeLock = null;

  function pitido(freq = 880, ms = 70, vol = 0.25) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = freq;
      osc.type = 'square';
      gain.gain.setValueAtTime(vol, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + ms / 1000);
      osc.connect(gain).connect(audio.destination);
      osc.start();
      osc.stop(audio.currentTime + ms / 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  function startMetronome(onTick) {
    stopMetronome();
    compresiones = 0;
    pitido(1100, 45, 0.3);
    // 110 bpm ~= 545 ms per beat
    metronomo = setInterval(() => {
      compresiones++;
      pitido(1100, 45, 0.3);
      if (typeof onTick === 'function') onTick(compresiones);
    }, 545);
  }

  function stopMetronome() {
    if (metronomo) {
      clearInterval(metronomo);
      metronomo = null;
    }
  }

  function isMetronomeActive() {
    return metronomo !== null;
  }

  function startBurnTimer(minutes, onTick, onComplete) {
    stopBurnTimer();
    restanQuemadura = minutes * 60;
    pitido(760, 60, 0.2);
    cuentaQuemadura = setInterval(() => {
      restanQuemadura--;
      if (typeof onTick === 'function') onTick(restanQuemadura);
      if (restanQuemadura <= 0) {
        stopBurnTimer();
        pitido(660, 220, 0.3);
        setTimeout(() => pitido(880, 220, 0.3), 300);
        setTimeout(() => pitido(660, 320, 0.3), 620);
        if (typeof onComplete === 'function') onComplete();
      }
    }, 1000);
  }

  function stopBurnTimer() {
    if (cuentaQuemadura) {
      clearInterval(cuentaQuemadura);
      cuentaQuemadura = null;
    }
  }

  async function requestWakeLock() {
    if ('wakeLock' in navigator && navigator.wakeLock) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
        return true;
      } catch (err) {
        return false;
      }
    }
    return false;
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  return {
    startMetronome,
    stopMetronome,
    isMetronomeActive,
    startBurnTimer,
    stopBurnTimer,
    requestWakeLock,
    releaseWakeLock,
    pitido
  };
})();

    { id: 'higiene', image: 'imagenes/guias/12-wc-emergencia.webp', tone: 'teal', copy: { es: ['WC DE EMERGENCIA', 'Separa orina y heces. Cierra los residuos. Lávate las manos.', 'Aléjalos de comida y agua. Sigue la recogida municipal.'], en: ['EMERGENCY TOILET', 'Separate urine and faeces. Seal waste. Wash your hands.', 'Keep waste away from food and water. Follow municipal instructions.'], nl: ['NOODTOILET', 'Scheid urine en ontlasting. Sluit afval af. Was je handen.', 'Houd afval weg van eten en water. Volg gemeentelijke instructies.'] } }
  ];

  /* Pictogramas vectoriales propios para la familia «señal». Trazo grueso, negro sobre blanco: nítidos en impresión térmica. */
  const SVG_A = 'viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"';
  const S = {

    monoxido: `<svg ${SVG_A}><path d="M28 78V44l20-16 20 16v34"/><path d="M36 78v-9a12 12 0 0 1 24 0v9"/><path d="M41 66h14"/><path d="M42 55q5-5 0-10M54 55q-5-5 0-10"/></svg>`,
    aire: `<svg ${SVG_A}><path d="M25 46a10 10 0 0 1 19-4 13 13 0 0 1 23 3 9 9 0 0 1 4 18H30a11 11 0 0 1-5-17z"/><circle cx="42" cy="55" r="2.6" fill="currentColor" stroke="none"/><circle cx="54" cy="55" r="2.6" fill="currentColor" stroke="none"/><path d="M43 64h10"/></svg>`,
    inundacion: `<svg ${SVG_A}><path d="M28 70V42l20-16 20 16v28"/><path d="M33 70v-9h8v-8h8v-8h8"/><path d="M57 37v13M51 43l6-8 6 8"/><path d="M10 84q5-4 10 0t10 0M66 84q5-4 10 0t10 0"/></svg>`,
    agua: `<svg ${SVG_A}><path d="M28 28v14h28a9 9 0 0 1 9 9v7"/><path d="M20 28h16"/><path d="M36 64h22l-3 20H39z"/><circle cx="48" cy="52" r="39"/><path d="M20 22l56 56"/></svg>`,
    quemadura: `<svg ${SVG_A}><path d="M34 78V58a14 14 0 0 1 28 0v20"/><path d="M34 64q-11 0-11 9"/><path d="M40 36q-5 7 0 10 5-3 0-10zM56 30q-5 7 0 10 5-3 0-10zM48 48q-4 6 0 8 4-2 0-8z" fill="currentColor"/></svg>`,
    mochila: `<svg ${SVG_A}><rect x="20" y="40" width="32" height="34" rx="8"/><path d="M28 40v-5a8 8 0 0 1 16 0v5"/><rect x="28" y="54" width="16" height="12" rx="3"/><path d="M60 57h20M74 50l8 7-8 7"/></svg>`,
    mascota: `<svg ${SVG_A}><rect x="20" y="42" width="56" height="32" rx="9"/><path d="M34 42a14 14 0 0 1 28 0"/><path d="M38 42l4-13 9 9M58 42l-4-13-9 9"/><circle cx="40" cy="55" r="2.6" fill="currentColor" stroke="none"/><circle cx="56" cy="55" r="2.6" fill="currentColor" stroke="none"/><path d="M28 64h40"/></svg>`,
    wc: `<svg ${SVG_A}><path d="M28 42h40l-5 36H33z"/><ellipse cx="48" cy="41" rx="21" ry="6"/><circle cx="78" cy="68" r="10"/><circle cx="78" cy="68" r="3.5"/></svg>`
  };
  const SIGNWORD = { emergencia: 'EMERGENCIA', auxilios: 'PRIMEROS AUXILIOS', peligro: 'PELIGRO', advertencia: 'ADVERTENCIA', prohibido: 'PROHIBIDO', informacion: 'INFORMACIÓN' };
  const SIGNLIST = [
    { id: 'llamar', from: 'llamar', type: 'emergencia', svg: S.phone },
    { id: 'sangrado', from: 'sangrado', type: 'auxilios', svg: S.cross },
    { id: 'gas', from: 'gas', type: 'prohibido', svg: S.gas },
    { id: 'monoxido', from: 'monoxido', type: 'peligro', svg: S.monoxido },
    { id: 'aire', from: 'aire', type: 'advertencia', svg: S.aire },
    { id: 'inundacion', from: 'inundacion', type: 'advertencia', svg: S.inundacion },
    { id: 'agua', from: 'agua', type: 'prohibido', svg: S.agua },
    { id: 'quemadura', from: 'quemadura', type: 'auxilios', svg: S.quemadura },
    { id: 'evacuacion', from: 'evacuacion', type: 'informacion', svg: S.mochila },
    { id: 'mascota', from: 'mascota', type: 'informacion', svg: S.mascota },
    { id: 'higiene', from: 'higiene', type: 'informacion', svg: S.wc }

  const FORMATS = {
    a4: { label: 'A4 · 210 × 297 mm', w: 210, h: 297, kind: 'a4' },
    a4h: { label: 'A4 · 297 × 210 mm', w: 297, h: 210, kind: 'a4h' },
    '4x6': { label: 'MUNBYN · 4 × 6 in · 101,6 × 152,4 mm', w: 101.6, h: 152.4, kind: 'large' },
    '60x40': { label: 'MUNBYN · 60 × 40 mm', w: 60, h: 40, kind: 'small' },
    '57x32': { label: 'MUNBYN · 57 × 32 mm', w: 57, h: 32, kind: 'small' },
    '50x30': { label: 'MUNBYN · 50 × 30 mm', w: 50, h: 30, kind: 'small' },
    '40x30': { label: 'MUNBYN · 40 × 30 mm', w: 40, h: 30, kind: 'small' }
  };
  const LANG = { es: 'ES', en: 'EN', nl: 'NL' };

  const sign = () => SIGNLIST.find(x => 'senal-' + x.id === settings.poster) || SIGNLIST[0];
  const items = () => settings.style === 'senal' ? SIGNLIST : P;
  const langs = () => settings.lang === 'all' ? ['es', 'en', 'nl'] : [settings.lang];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function signSheet(s, all) {
    const f = FORMATS[settings.format], ls = all ? ['es', 'en', 'nl'] : langs(), copy = P.find(x => x.id === s.from).copy;
    return `<article class="print-poster poster-sign poster-${f.kind} sign-${s.type}${settings.mono ? ' poster-mono' : ''}" data-poster="senal-${s.id}" data-format="${settings.format}"><div class="sign-band"><b>${SIGNWORD[s.type]}</b><small>OPENREFUGIO · 112</small></div><div class="sign-picto">${s.svg}</div><div class="sign-lines">${ls.map(l => `<p lang="${l}"><strong>${esc(copy[l][0])}</strong> · ${esc(copy[l][2])}</p>`).join('')}</div></article>`;
  }

  function sheet(item, all = false) {
    if (settings.style === 'senal') return signSheet(item && item.svg ? item : sign(), all);
    const p = item && item.image ? item : poster();
    const f = FORMATS[settings.format], ls = all ? ['es', 'en', 'nl'] : langs();
    const cols = (f.kind === 'a4' || f.kind === 'large') && ls.length > 1;
    const inline = f.kind === 'small' ? (() => { const t = Math.min(1.05, Math.max(0.5, Math.sqrt(f.w * f.h / 1500) * (f.w < 45 ? 0.85 : 1))); return ` style="aspect-ratio:${f.w}/${f.h};--ps-title:${(13 * t).toFixed(1)}pt;--ps-p:${(8.5 * t).toFixed(1)}pt;--ps-span:${(7 * t).toFixed(1)}pt;--ps-foot:${(6 * t).toFixed(1)}pt"`; })() : '';

  }

  function preview() {
    const root = document.querySelector('#poster-print-root');
    if (!root) return;
    const list = items();
    root.innerHTML = printAll ? list.map(p => sheet(p, true)).join('') : sheet();
    root.dataset.mode = printAll ? 'all' : 'one';
  }

  function formatHelp() {
    const f = FORMATS[settings.format];
    if (settings.style === 'senal') return f.kind === 'large' ? I18n.t('postersHelpSignLarge') : I18n.t('postersHelpSign');
    if (f.kind === 'small') return I18n.t('postersHelpSmall');
    if (f.kind === 'large') return I18n.t('postersHelpLarge');
    return I18n.t('postersHelpA4');
  }

  function choiceOptions() {
    return items().map(p => {
      const id = settings.style === 'senal' ? 'senal-' + p.id : p.id;
      const label = P.find(x => x.id === (p.from || p.id)).copy.es[0];
      return `<option value="${id}"${id === settings.poster ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('');
  }

  function sync() {
    const senal = settings.style === 'senal';
    if (senal && FORMATS[settings.format].kind === 'small') settings.format = '4x6';
    const f = FORMATS[settings.format], thermal = f.kind === 'small' || f.kind === 'large';
    if (thermal) { if (settings.lang === 'all') settings.lang = 'es'; settings.mono = true; }
    const styleSel = document.querySelector('#poster-style');
    if (styleSel) styleSel.value = settings.style;
    const choice = document.querySelector('#poster-choice');
    if (choice && choice.dataset.style !== settings.style) { choice.dataset.style = settings.style; choice.innerHTML = choiceOptions(); }
    if (choice) choice.value = settings.poster;
    const format = document.querySelector('#poster-format');
    if (format) {
      format.querySelectorAll('option').forEach(o => { o.disabled = senal && FORMATS[o.value].kind === 'small'; });
      format.value = settings.format;
    }
    const lang = document.querySelector('#poster-language'), mono = document.querySelector('#poster-mono');
    if (lang) { lang.value = settings.lang; lang.querySelector('option[value="all"]').disabled = thermal; }
    if (mono) { mono.checked = settings.mono; mono.disabled = thermal; }
    const help = document.querySelector('#poster-format-help');
    if (help) help.textContent = formatHelp();
    const size = document.querySelector('#poster-size-label');
    if (size) size.textContent = f.label;
    preview();
  }

  function print(mode) {
    const gen = ++printGen;
    const old = { format: settings.format, lang: settings.lang, mono: settings.mono, poster: settings.poster, style: settings.style };
    printAll = mode === 'all';
    if (printAll) { settings.format = 'a4'; settings.lang = 'all'; settings.mono = false; }
    const f = FORMATS[settings.format];
    preview();
    let style = document.querySelector('#poster-page-style');
    if (!style) { style = document.createElement('style'); style.id = 'poster-page-style'; document.head.appendChild(style); }
    style.textContent = `@media print{@page{size:${f.w}mm ${f.h}mm;margin:0}body.poster-printing .print-poster{width:${f.w}mm;height:${f.h}mm}}`;
    document.body.classList.add('poster-printing');
    const done = () => {
      if (gen !== printGen) return; // impresión superada por otra más reciente
      printGen++;
      document.body.classList.remove('poster-printing');
      style.textContent = '';
      settings = { ...settings, ...old };
      printAll = false;
      sync();
      window.removeEventListener('afterprint', done);
    };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 1000);
  }

  function bind() {
    if (bound) return;
    bound = true;
    document.addEventListener('change', e => {
      if (e.target.id === 'poster-style') { settings.style = e.target.value; settings.poster = settings.style === 'senal' ? 'senal-' + SIGNLIST[0].id : P[0].id; }
      if (e.target.id === 'poster-choice') settings.poster = e.target.value;
      if (e.target.id === 'poster-format') settings.format = e.target.value;
      if (e.target.id === 'poster-language') settings.lang = e.target.value;
      if (e.target.id === 'poster-mono') settings.mono = e.target.checked;
      if (e.target.closest('.poster-controls') || e.target.id === 'poster-mono') sync();
    });
    document.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (b && b.id === 'print-poster') print('one');
      if (b && b.id === 'print-all-posters') print('all');
    });
  }

  function render(el) {
    el.innerHTML = `
      <div class="section-title">
        <h2>🖨 ${I18n.t('postersTitle')}</h2>
        <small class="muted">${I18n.t('postersDesc')}</small>
      </div>
      <div class="panel">
        <div class="poster-controls no-print">
          <div class="field"><label for="poster-style">${I18n.t('postersType')}</label><select id="poster-style"><option value="guia"${settings.style === 'guia' ? ' selected' : ''}>${I18n.t('postersTypeGuide')}</option><option value="senal"${settings.style === 'senal' ? ' selected' : ''}>${I18n.t('postersTypeSign')}</option></select></div>
          <div class="field"><label for="poster-choice">${I18n.t('postersInfo')}</label><select id="poster-choice" data-style="${settings.style}">${choiceOptions()}</select></div>
          <div class="field"><label for="poster-format">${I18n.t('postersFormat')}</label><select id="poster-format">${Object.entries(FORMATS).map(([id, f]) => `<option value="${id}"${id === settings.format ? ' selected' : ''}>${f.label}</option>`).join('')}</select></div>
          <div class="field"><label for="poster-language">${I18n.t('postersLanguage')}</label><select id="poster-language"><option value="all"${settings.lang === 'all' ? ' selected' : ''}>${I18n.t('postersLangAll')}</option>${Object.entries(LANG).map(([id, n]) => `<option value="${id}"${id === settings.lang ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
        </div>
        <label class="checkrow no-print"><input id="poster-mono" type="checkbox"${settings.mono ? ' checked' : ''}><span><strong>${I18n.t('postersMono')}</strong><small>${I18n.t('postersMonoHint')}</small></span></label>
        <p id="poster-format-help" class="muted no-print">${formatHelp()}</p>
        <div class="actions no-print">
          <button type="button" id="print-poster" class="button primary">🖨 ${I18n.t('postersPrintThis')}</button>
          <button type="button" id="print-all-posters" class="button">${I18n.t('postersPrintAll')}</button>
        </div>
      </div>
      <div class="poster-preview">
        <div class="poster-preview-label no-print"><span>${I18n.t('postersPreview')}</span><span id="poster-size-label">${FORMATS[settings.format].label}</span></div>
        <div id="poster-print-root" aria-live="polite"></div>
      </div>
      <details class="no-print"><summary>${I18n.t('postersTips')}</summary><div class="detail"><p class="source">${I18n.t('postersTipsBody')}</p></div></details>`;
    bind();
    sync();
  }

  return { render, items: P, signs: SIGNLIST, formats: FORMATS };
})();

    <script>'use strict';

/**
 * OpenRefugio - Main Application Engine
 * Pure Vanilla JS, zero dependencies, client-side only.
 */
(function() {
  const I18n = window.OpenRefugioI18n;
  const Profile = window.OpenRefugioProfile;
  const Content = window.OpenRefugioContent;
  const Tools = window.OpenRefugioTools;
  const Posters = window.OpenRefugioPosters;

  const STATE_KEY = 'openrefugio:state:v1';
  let appState = {
    checks: {},
    emergencyMode: false,
    emergencySince: 0
  };

  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        appState = { ...appState, ...parsed };
      }
    } catch (e) {
      console.warn('Could not load app state:', e);
    }
    // Expire emergency mode after 12 hours
    if (appState.emergencyMode && Date.now() - appState.emergencySince > 12 * 3600 * 1000) {
      appState.emergencyMode = false;
      appState.emergencySince = 0;
      saveState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify(appState));
    } catch (e) {
      console.error('Failed to save state:', e);
    }
  }

  function toggleCheck(id) {
    appState.checks[id] = !appState.checks[id];
    saveState();
    renderReadiness();
  }

  function isChecked(id) {
    return !!appState.checks[id];
  }

  function getActiveRoute() {
    return (location.hash || '#inicio').replace(/^#/, '');
  }

  function navigate(route) {
    location.hash = '#' + route;
  }

  // DOM Elements
  let mainEl = null;
  let navEl = null;
  let topbarEl = null;

  function initApp() {
    loadState();
    mainEl = document.getElementById('main');
    navEl = document.getElementById('navigation');
    topbarEl = document.getElementById('topbar');

    window.addEventListener('hashchange', renderCurrentRoute);
    window.addEventListener('openrefugio:langchange', () => {
      renderNav();
      renderTopbar();
      renderCurrentRoute();
    });
    window.addEventListener('openrefugio:profilechange', () => {
      renderTopbar();
      renderCurrentRoute();
    });

    renderNav();
    renderTopbar();
    renderCurrentRoute();
  }

  function renderTopbar() {
    if (!topbarEl) return;
    const prof = Profile.get();
    const currentLang = I18n.getLanguage();

    topbarEl.innerHTML = `
      <div>
        <span class="profile-badge">📍 ${escapeHtml(prof.regionPreset.toUpperCase())} · 👥 ${prof.adults + prof.minors}</span>
        <a class="call" href="tel:${escapeHtml(prof.emergencyPhone)}">🚨 ${escapeHtml(prof.emergencyPhone || '112')}</a>
      </div>
      <div>
        <div class="lang-picker" role="radiogroup" aria-label="${I18n.t('switchLanguage')}">
          <button type="button" class="lang-btn" data-lang="es" aria-pressed="${currentLang === 'es'}">ES</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="${currentLang === 'en'}">EN</button>
          <button type="button" class="lang-btn" data-lang="nl" aria-pressed="${currentLang === 'nl'}">NL</button>
        </div>
        <button type="button" id="btn-emergency-toggle" class="${appState.emergencyMode ? 'danger-button' : 'button quiet'}">
          ${appState.emergencyMode ? I18n.t('emergencyActive') : I18n.t('emergencyMode')}
        </button>
      </div>
    `;

    topbarEl.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        I18n.setLanguage(e.target.dataset.lang);
      });
    });

    const emBtn = document.getElementById('btn-emergency-toggle');
    if (emBtn) {
      emBtn.addEventListener('click', () => {
        appState.emergencyMode = !appState.emergencyMode;
        appState.emergencySince = appState.emergencyMode ? Date.now() : 0;
        document.body.classList.toggle('emergency', appState.emergencyMode);
        saveState();
        renderTopbar();
      });
    }

    document.body.classList.toggle('emergency', !!appState.emergencyMode);
  }

  function renderNav() {
    if (!navEl) return;
    const route = getActiveRoute();

    const items = [
      ['inicio', '⌂', I18n.t('navHome')],
      ['10minutos', '⏱', I18n.t('nav10min')],
      ['simulador', '◈', I18n.t('navSim')],
      ['perfil', '⚙', I18n.t('profileTitle')],
      ['preparacion', '☑', I18n.t('navPrep')],
      ['herramientas', '⏲', I18n.t('navTools')],
      ['visual', '👁', I18n.t('navVisual')],
      ['posters', '🖨', I18n.t('navPosters')],
      ['copias', '💾', I18n.t('navBackup')]
    ];

    navEl.innerHTML = items.map(([id, symbol, label]) => `
      <a href="#${id}" class="nav-link" aria-current="${route === id ? 'page' : 'false'}">
        <span class="symbol">${symbol}</span>
        <span>${escapeHtml(label)}</span>
      </a>
    `).join('');
  }

  function renderReadiness() {
    const total = Content.homeChecklist.length + Content.evacuationChecklist.length;
    let checked = 0;
    Content.homeChecklist.forEach(item => { if (isChecked(item.id)) checked++; });
    Content.evacuationChecklist.forEach(item => { if (isChecked(item.id)) checked++; });
    const percent = Math.round((checked / total) * 100);

    const el = document.getElementById('readiness-widget');
    if (el) {
      el.innerHTML = `
        <div class="readiness">
          <strong>${percent}%</strong>
          <div>
            <h3>${I18n.t('navPrep')}</h3>
            <p>${checked} / ${total} ${I18n.t('allReady')}</p>
            <div class="progress"><span style="width:${percent}%"></span></div>
          </div>
          <a href="#preparacion" class="button primary">${I18n.t('reviewed')}</a>
        </div>
      `;
    }
  }

  function renderCurrentRoute() {
    renderNav();
    const route = getActiveRoute();
    if (!mainEl) return;

    window.scrollTo(0, 0);

    switch (route) {
      case 'inicio':
        renderHomeRoute();
        break;
      case '10minutos':
        render10MinRoute();
        break;
      case 'simulador':
        renderSimulatorRoute();
        break;
      case 'perfil':
        renderProfileRoute();
        break;
      case 'preparacion':
        renderPreparednessRoute();
        break;
      case 'herramientas':
        renderToolsRoute();
        break;
      case 'visual':
        renderVisualRoute();
        break;
      case 'posters':
        renderPostersRoute();
        break;
      case 'copias':
        renderBackupRoute();
        break;
      default:
        // Check if route is a scenario
        if (Content.scenarios[route]) {
          renderScenarioDetail(Content.scenarios[route]);
        } else {
          renderHomeRoute();
        }
        break;
    }
  }

  function renderSimulatorRoute() {
    const prof = Profile.get();
    let days = 3;

    function calc() {
      const persons = prof.adults + prof.minors + prof.dependents;
      const waterPerPerson = 3; // L/day
      const foodPerPerson = 3; // meals/day
      const petWater = prof.petCount * prof.petWaterLitersPerDay;
      const petFoodKg = (prof.petCount * prof.petFoodGramsPerDay * days) / 1000;

      const totalWater = Math.round((persons * waterPerPerson + petWater) * days * 10) / 10;
      const totalFood = persons * foodPerPerson * days;
      const cash = (prof.adults * 70) + (prof.minors * 30);

      return { totalWater, totalFood, cash, petFoodKg };
    }

    function update() {
      const res = calc();
      const wEl = document.getElementById('calc-water');
      const fEl = document.getElementById('calc-food');
      const cEl = document.getElementById('calc-cash');
      const pEl = document.getElementById('calc-pet-food');

      if (wEl) wEl.textContent = `${res.totalWater} L`;
      if (fEl) fEl.textContent = `${res.totalFood} ${I18n.t('foodCalcTitle')}`;
      if (cEl) cEl.textContent = `€${res.cash}`;
      if (pEl) pEl.textContent = `${res.petFoodKg} kg`;
    }

    const res = calc();

    mainEl.innerHTML = `
      <div class="section-title">
        <h2>◈ ${I18n.t('simulatorTitle')}</h2>
      </div>

      <div class="panel">
        <div class="form-grid">

          </div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <small>${I18n.t('waterCalcTitle')}</small>
          <div class="stat" id="calc-water">${res.totalWater} L</div>
          <p class="muted">${I18n.t('waterFormulaNote')}</p>
        </div>

        <div class="panel">

          </div>

        <div class="actions">
          <button type="button" id="btn-light-white" class="button primary">Luz Blanca</button>
          <button type="button" id="btn-light-warm" class="button">Luz Ámbar (Noche)</button>
        </div>
      </div>
    `;

    // Metronome logic
    const rcpBtn = document.getElementById('btn-rcp-toggle');
    const rcpDisp = document.getElementById('rcp-display');
    rcpBtn.addEventListener('click', () => {
      if (Tools.isMetronomeActive()) {
        Tools.stopMetronome();
        rcpBtn.textContent = I18n.t('metronomeStart');
      } else {
        Tools.startMetronome((cnt) => {
          rcpDisp.textContent = cnt;
        });
        rcpBtn.textContent = I18n.t('metronomeStop');
      }
    });

    // Burn timer logic
    const burnStartBtn = document.getElementById('btn-burn-start');
    const burnStopBtn = document.getElementById('btn-burn-stop');
    const burnDisp = document.getElementById('burn-display');
    burnStartBtn.addEventListener('click', () => {
      burnStartBtn.hidden = true;
      burnStopBtn.hidden = false;
      Tools.startBurnTimer(15, (left) => {
        const m = String(Math.floor(left / 60)).padStart(2, '0');
        const s = String(left % 60).padStart(2, '0');
        burnDisp.textContent = `${m}:${s}`;
      }, () => {
        burnStartBtn.hidden = false;
        burnStopBtn.hidden = true;
        burnDisp.textContent = '15:00';
        alert('15 minutos completados. Cubre la quemadura con film o apósito limpio.');
      });
    });
    burnStopBtn.addEventListener('click', () => {
      Tools.stopBurnTimer();
      burnStartBtn.hidden = false;
      burnStopBtn.hidden = true;
      burnDisp.textContent = '15:00';
    });

    // Flashlight logic
    const makeLight = (warm) => {
      const fl = document.createElement('div');
      fl.id = 'linterna';
      fl.className = warm ? 'calida' : '';
      fl.innerHTML = `<button type="button" class="button" style="font-size:20px;padding:16px 28px">Cerrar Linterna</button>`;
      document.body.appendChild(fl);
      Tools.requestWakeLock();
      fl.querySelector('button').addEventListener('click', () => {
        Tools.releaseWakeLock();
        fl.remove();
      });
    };
    document.getElementById('btn-light-white').addEventListener('click', () => makeLight(false));
    document.getElementById('btn-light-warm').addEventListener('click', () => makeLight(true));
  }

          <button type="button" class="button primary" onclick="window.print()">🖨 ${I18n.t('printNow')}</button>
        </div>
      </div>
    `;
  }

  function renderBackupRoute() {
    mainEl.innerHTML = `
      <div class="section-title">
        <h2>💾 ${I18n.t('navBackup')}</h2>
      </div>

      <div class="grid two">
        <div class="panel">
          <h3>📦 Exportación de Seguridad</h3>
          <p class="muted">Descarga tu plan, inventario y configuración de perfil en un archivo JSON local.</p>
          <div class="actions">
            <button type="button" id="btn-export-json" class="button primary">${I18n.t('exportJson')}</button>
          </div>
        </div>

        <div class="panel">
          <h3>📥 Importar Copia</h3>
          <p class="muted">Restaura tu configuración en cualquier otro dispositivo sin tocar ningún servidor.</p>
          <input type="file" id="input-import-json" accept=".json" style="margin-top:10px">
        </div>
      </div>

      <div class="panel" style="margin-top:24px">
        <h3>📄 Versión Portable Autocontenida</h3>
        <p class="muted">Un único archivo HTML con toda la biblioteca, estilos, scripts y guías incrustadas para llevar en un pendrive o en el móvil sin necesidad de servidor.</p>
        <div class="actions">
          <a href="open-refugio-portable.html" download="open-refugio-portable.html" class="button primary">⬇️ ${I18n.t('downloadPortable')}</a>
        </div>
      </div>
    `;

    document.getElementById('btn-export-json').addEventListener('click', () => {
      const dump = {
        app: 'OpenRefugio',
        version: '1.0.0',
        exportedAt: new Date().toISOString(),
        profile: Profile.get(),
        state: appState
      };
      const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `open-refugio-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('input-import-json').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (parsed.profile) Profile.save(parsed.profile);
          if (parsed.state) {
            appState = parsed.state;
            saveState();
          }
          alert('Copia de seguridad restaurada con éxito.');
          renderCurrentRoute();
        } catch (err) {
          alert('Error: el archivo no tiene un formato válido.');
        }
      };
      reader.readAsText(file);
    });
  }

  function capitalize(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* ------------------------------------------------------------------
   * Sidebar search: fuzzy-free keyword index over routes, scenarios,
   * visual guides, tools and posters. Results render in the current UI
   * language and navigate via hash links.
   * ------------------------------------------------------------------ */
  const SEARCH_ROUTES = [
    ['inicio', 'navHome'],
    ['10minutos', 'nav10min'],
    ['simulador', 'navSim'],
    ['preparacion', 'navPrep'],
    ['herramientas', 'navTools'],
    ['visual', 'navVisual'],
    ['posters', 'navPosters'],
    ['copias', 'navBackup']
  ];

  const SEARCH_EXTRA = [
    { route: 'herramientas', t: { es: 'Metrónomo RCP', en: 'CPR metronome', nl: 'Reanimatiemetronoom' }, d: { es: 'Ritmo de compresiones para reanimación cardiopulmonar.', en: 'Compression rhythm for cardiopulmonary resuscitation.', nl: 'Tempo voor hartmassage bij reanimatie.' } },
    { route: 'herramientas', t: { es: 'Temporizador de enfriamiento de quemadura', en: 'Burn cooling timer', nl: 'Timer voor brandwonden' }, d: { es: 'Cuenta los 10–20 minutos de agua corriente sobre la quemadura.', en: 'Counts the 10–20 minutes of running water on the burn.', nl: 'Telt de 10–20 minuten koel water op de brandwond.' } },
    { route: 'herramientas', t: { es: 'Linterna de pantalla', en: 'Screen flashlight', nl: 'Zaklamp van het scherm' }, d: { es: 'Pantalla blanca a máximo brillo para iluminar en un apagón.', en: 'White screen at full brightness to light up during a blackout.', nl: 'Wit scherm op volle helderheid bij een stroomstoring.' } },
    { route: 'visual', t: { es: 'Presión sobre hemorragia', en: 'Bleeding pressure', nl: 'Druk op bloeding' }, d: { es: 'Presiona firmemente sobre la herida con tela limpia.', en: 'Press firmly on the wound with a clean cloth.', nl: 'Druk stevig op de wond met een schone doek.' } },
    { route: 'visual', t: { es: 'Enfriamiento de quemadura', en: 'Burn cooling', nl: 'Brandwond koelen' }, d: { es: '15 a 20 minutos bajo agua corriente limpia templada o fresca.', en: '15 to 20 minutes under clean lukewarm or cool running water.', nl: '15 tot 20 minuten onder schoon, lauw of koel stromend water.' } },
    { route: 'visual', t: { es: 'Maniobra de atragantamiento', en: 'Choking manoeuvre', nl: 'Verstikking manoeuvre' }, d: { es: '5 golpes secos en la espalda alternados con 5 compresiones abdominales.', en: '5 back blows alternating with 5 abdominal thrusts.', nl: '5 rugklappen afgewisseld met 5 buikstoten.' } },
    { route: 'visual', t: { es: 'Posición lateral de seguridad', en: 'Recovery position', nl: 'Houding halfzijdig' }, d: { es: 'Para personas inconscientes que respiran con normalidad.', en: 'For unconscious people who are breathing normally.', nl: 'Voor bewusteloze personen die normaal ademen.' } },
    { route: 'visual', t: { es: 'Mascota en transportín', en: 'Pet in carrier', nl: 'Huisdier in reismand' }, d: { es: 'Nunca evacuar con animales sueltos. Asegurar arnés y transportín.', en: 'Never evacuate with loose animals. Secure harness and carrier.', nl: 'Nooit evacueren met losse dieren. Harnas en reismand vastzetten.' } },
    { route: 'visual', t: { es: 'Cierre de gas y ventilación', en: 'Gas shutoff and ventilation', nl: 'Gas dicht en ventileren' }, d: { es: 'Girar la llave de paso 90 grados y ventilar sin generar chispas.', en: 'Turn the shutoff valve 90 degrees and ventilate without sparks.', nl: 'Draai de hoofdkraan 90 graden en ventileer zonder vonken.' } }
  ];

  function normSearch(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[^a-z0-9 ]/g, '');
  }

  function searchLangText(obj, lang) {
    if (!obj) return '';
    return obj[lang] || obj.es || obj.en || '';
  }

  function buildSearchIndex() {
    const lang = I18n.getLanguage();
    const tr = I18n.translations || {};
    const entries = [];

    SEARCH_ROUTES.forEach(([route, key]) => {
      entries.push({
        route,
        title: I18n.t(key),
        text: '',
        hay: [tr.es && tr.es[key], tr.en && tr.en[key], tr.nl && tr.nl[key]].join(' ')
      });
    });

    Object.values(Content.scenarios).forEach((sc) => {
      (sc.steps || []).forEach((step) => {
        entries.push({
          route: 'situacion/' + sc.id,
          title: searchLangText(step.title, lang),
          text: searchLangText(step.detail, lang),
          hay: [step.title && step.title.es, step.title && step.title.en, step.title && step.title.nl,
                step.detail && step.detail.es, step.detail && step.detail.en, step.detail && step.detail.nl].join(' ')
        });
      });
    });

    SEARCH_EXTRA.forEach((item) => {
      entries.push({
        route: item.route,
        title: searchLangText(item.t, lang),
        text: searchLangText(item.d, lang),
        hay: [item.t.es, item.t.en, item.t.nl, item.d.es, item.d.en, item.d.nl].join(' ')
      });
    });

    (Posters.items || []).forEach((poster) => {
      const copy = poster.copy || {};
      const lines = copy[lang] || copy.es || [];
      entries.push({
        route: 'posters',
        title: lines[0] || poster.id,
        text: lines.slice(1).join(' '),
        hay: [copy.es, copy.en, copy.nl].filter(Array.isArray).map((l) => l.join(' ')).join(' ')
      });
    });

    return entries.map((e) => ({ ...e, nHay: normSearch(e.hay + ' ' + e.title + ' ' + e.text) }));
  }

  function renderSearch(query) {
    const box = document.getElementById('search-results');
    const input = document.getElementById('search');
    if (!box || !input) return;
    const q = normSearch(query).trim();
    if (q.length < 2) {
      box.hidden = true;
      box.innerHTML = '';
      return;
    }
    const results = [];
    buildSearchIndex().forEach((e) => {
      let score = -1;
      if (e.nHay.indexOf(q) !== -1) score = e.nHay.indexOf(' ' + q + ' ') !== -1 ? 0 : 2;
      if (score !== -1) results.push({ e, score });
    });
    results.sort((a, b) => a.score - b.score || a.e.title.localeCompare(b.e.title));
    const top = results.slice(0, 8);
    if (!top.length) {
      box.innerHTML = '<p>' + escapeHtml(I18n.t('searchNoResults')) + '</p>';
    } else {
      box.innerHTML = top.map(({ e }) => {
        const detail = e.text ? e.text.slice(0, 90) + (e.text.length > 90 ? '…' : '') : e.title;
        return '<a href="#' + escapeHtml(e.route) + '"><strong>' + escapeHtml(e.title) + '</strong><small>' + escapeHtml(detail) + '</small></a>';
      }).join('');
    }
    box.hidden = false;
  }

  function applySearchLang() {
    const input = document.getElementById('search');
    const label = document.getElementById('search-label');
    if (input) input.placeholder = I18n.t('searchPlaceholder');
    if (label) label.textContent = I18n.t('searchLabel');
  }

  function wireSearch() {
    const input = document.getElementById('search');
    const box = document.getElementById('search-results');
    if (!input || !box) return;
    applySearchLang();
    input.addEventListener('input', () => renderSearch(input.value));
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') {
        input.value = '';
        box.hidden = true;
        box.innerHTML = '';
      }
    });
    box.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) {
        input.value = '';
        box.hidden = true;
        box.innerHTML = '';
      }
    });
    window.addEventListener('openrefugio:langchange', () => {
      applySearchLang();
      box.hidden = true;
      box.innerHTML = '';
    });
  }

  document.addEventListener('DOMContentLoaded', wireSearch);
  document.addEventListener('DOMContentLoaded', initApp);
})();
</script>
